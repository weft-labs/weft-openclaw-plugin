name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run format:check
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run test

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check skill drift against weftlabs/skills
        run: |
          ref=$(cat SKILLS_REF)
          git clone https://github.com/weftlabs/skills "$RUNNER_TEMP/canonical-skills"
          git -C "$RUNNER_TEMP/canonical-skills" -c advice.detachedHead=false checkout "$ref"
          diff -r "$RUNNER_TEMP/canonical-skills/skills/weft" agent-plugin/skills/weft
      - run: pnpm run bundle:check
      - run: pnpm run openclaw:check
      - run: pnpm run package:check

  ci-success:
    if: always()
    needs: [quality, typecheck, test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = [name for name, result in needs.items() if result["result"] != "success"]
          if failed:
              print("Failed jobs: " + ", ".join(failed))
              sys.exit(1)
          print("All CI jobs passed.")
          PY
